<!-- @dsCard group="Data" height=300 subtitle="Kanban column and card: well, hairlines, an identity square" -->
<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap"><style>
  *{box-sizing:border-box} body{margin:0;padding:20px;background:var(--ground);color:var(--body);font-family:var(--font-sans);line-height:1.5}
  .mono{font-family:var(--font-mono)} .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .btn{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.04em;padding:12px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);cursor:pointer}
  .btn:hover{background:#333;border-color:#333} .btn.sec{background:var(--ground);color:var(--ink);border-color:var(--console)} .btn.sec:hover{background:var(--wash)}
  .btn.quiet{background:none;border-color:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:2px} .btn.danger{background:var(--ground);color:var(--danger-ink);border-color:var(--danger-ink)}
  .btn[disabled]{background:#E5E5E5;border-color:#E5E5E5;color:#666;cursor:default}
  .chip{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:2px 6px;background:var(--wash);color:var(--chip-ink);display:inline-flex;align-items:center;gap:6px}
  .chip.ok{background:var(--ok-bg);color:var(--ok-ink)} .chip.warn{background:var(--warn-bg);color:var(--warn-ink)} .chip.danger{background:var(--danger-bg);color:var(--danger-ink)}
  .m{width:7px;height:7px;display:inline-block;flex:none} .m.ok{background:var(--mark-ok)} .m.warn{background:var(--mark-warn)} .m.danger{background:var(--mark-danger)} .m.run{background:var(--signal)} .m.none{background:var(--mark-none)} .m.hollow{background:none;border:1.5px solid var(--faint)}
  .label{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)} .label::before{content:"\25A0";color:var(--signal);margin-right:10px;font-size:9px;vertical-align:1px}
</style><style></style></head><body>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
<div style="background:var(--well);border:1px solid var(--line-soft);padding:12px;display:grid;gap:10px;align-content:start"><h3 style="margin:0;font:600 14px var(--font-sans);display:flex;align-items:center;gap:8px;color:var(--ink)"><i style="width:8px;height:8px;background:var(--id-1);display:inline-block"></i>Mới <span style="font:11px var(--font-mono);color:var(--muted)">6</span></h3>
<div style="background:var(--ground);border:1px solid var(--line);padding:14px;display:grid;gap:10px"><div style="display:flex;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)"><span class="chip warn"><i class="m warn"></i>Ưu tiên</span><span class="chip">16/10</span></div><b style="font-size:14px;color:var(--ink);font-weight:600">Chốt danh sách trưng bày Tết cho Co.opmart</b><div style="height:4px;background:var(--line-soft)"><i style="display:block;height:4px;width:25%;background:var(--ink)"></i></div><span class="mono" style="font-size:11px;color:var(--muted)">1/4 · 25%</span></div></div>
<div style="background:var(--well);border:1px solid var(--line-soft);padding:12px;display:grid;gap:10px;align-content:start"><h3 style="margin:0;font:600 14px var(--font-sans);display:flex;align-items:center;gap:8px;color:var(--ink)"><i style="width:8px;height:8px;background:var(--id-2);display:inline-block"></i>Đang làm <span style="font:11px var(--font-mono);color:var(--muted)">5</span></h3>
<div style="background:var(--ground);border:1px solid var(--line);padding:14px;display:grid;gap:10px"><div style="display:flex;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)"><span class="chip danger"><i class="m danger"></i>Quá hạn 2 ngày</span></div><b style="font-size:14px;color:var(--ink);font-weight:600">Đàm phán chiết khấu quý IV</b><div style="height:4px;background:var(--line-soft)"><i style="display:block;height:4px;width:75%;background:var(--ink)"></i></div><span class="mono" style="font-size:11px;color:var(--muted)">3/4 · 75%</span></div></div></div></body></html>
